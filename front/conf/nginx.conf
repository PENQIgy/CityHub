worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    server {
        # 1. 将 Nginx 端口改为 80（避免和 Spring Boot 的 8080 冲突）
        listen       8000;
        server_name  localhost;

        # 2. 指定前端项目所在的位置（使用绝对路径，确保能找到你的前端文件）
        location / {
            root   "D:/CityHub/front/html/cityhub";
            index  index.html index.htm;
            # 如果刷新页面报404，可以取消下面这行的注释
            # try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # 3. 后端 API 代理配置
        location /api/ {
            default_type application/json;
            keepalive_timeout 30s;
            keepalive_requests 1000;
            proxy_http_version 1.1;
            proxy_request_buffering off; # 禁止 Nginx 缓存请求体，防止转发时丢失
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 核心：把 /api/user/code 转发给后端的 /user/code
            # 请确保你的 Spring Boot 后端端口与这里一致！如果你的后端是 8080，请把 8081 改成 8080
            proxy_pass http://127.0.0.1:8081/; 
            
            # 转发 Auth 头
            proxy_set_header Authorization $http_authorization;
        }

        # 4. 图片等静态资源缓存配置
        location /imgs/ {
            root "D:/CityHub/front/html/cityhub";
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # 后端上游服务器定义（负载均衡用，目前只有一个节点）
    # 注意：如果你的后端端口是 8080，这里的 8081 也要同步改成 8080
    upstream backend {
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
        #server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    }  
}