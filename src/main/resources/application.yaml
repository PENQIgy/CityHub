server:
  # 服务器端口号
  port: 8081
spring:
  application:
    # 应用名称
    name: cityhub
  datasource:
    # 数据库驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL
    url: jdbc:mysql://127.0.0.1:3306/cityhub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    # 数据库用户名
    username: root
    # 数据库密码
    password: 123456
  redis:
    # Redis主机地址
    host: 127.0.0.1
    # Redis端口号
    port: 6379
    # Redis密码
    password: 123456
    lettuce:
      pool:
        # 最大活跃连接数
        max-active: 10
        # 最大空闲连接数
        max-idle: 10
        # 最小空闲连接数
        min-idle: 1
        # 连接回收时间间隔
        time-between-eviction-runs: 10s
  servlet:
    multipart:
      # 探店笔记最多 9 张图，单张放宽到 10MB
      max-file-size: 10MB
      max-request-size: 100MB
  jackson:
    # JSON处理时忽略非空字段
    default-property-inclusion: non_null
    time-zone: GMT+8
mybatis-plus:
  # 别名扫描包
  type-aliases-package: com.cityhub.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键自增
      id-type: auto
logging:
  level:
    # 日志级别为debug
    com.cityhub: debug

# ---------------------------------------------------------------------
# CityHub 业务参数
# ---------------------------------------------------------------------
cityhub:
  # 图片上传根目录（nginx 静态资源目录下的 imgs）
  image-upload-dir: D:\nginx-1.18.0\html\cityhub\imgs\
  # Feed 流每页条数
  feed-page-size: 10
  # 笔记列表每页条数
  blog-page-size: 10
